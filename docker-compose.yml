version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_OSS_REGION=${NEXT_PUBLIC_OSS_REGION}
      - NEXT_PUBLIC_OSS_BUCKET=${NEXT_PUBLIC_OSS_BUCKET}
      - NEXT_PUBLIC_OSS_ENDPOINT=${NEXT_PUBLIC_OSS_ENDPOINT}
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY}
      - OSS_ACCESS_SECRET=${OSS_ACCESS_SECRET}
      - NEXT_PUBLIC_OSS_REGION=${NEXT_PUBLIC_OSS_REGION}
      - NEXT_PUBLIC_OSS_BUCKET=${NEXT_PUBLIC_OSS_BUCKET}
      - NEXT_PUBLIC_OSS_ENDPOINT=${NEXT_PUBLIC_OSS_ENDPOINT}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL at runtime}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD at runtime}
      - POSTGRES_DB=bigsong
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
